<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEPLUS - Admin Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#111827}
header{background:#111827;color:#fff;padding:20px 40px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:28px;font-weight:bold}.admin-title{font-size:18px}
.admin-container{max-width:1200px;margin:35px auto;padding:0 20px}
h1{text-align:center;margin-bottom:25px}
.section{background:#fff;padding:25px;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.08);margin-bottom:25px}
.section h2{margin-top:0}
#message{margin-bottom:15px}
.success{background:#dcfce7;color:#166534;padding:12px;border-radius:8px}
.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:8px}
.admin-user{background:#e0f2fe;color:#075985;padding:12px;border-radius:8px;margin-bottom:20px}
input,select,textarea{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #d1d5db;border-radius:7px;font-size:14px}
textarea{min-height:90px;resize:vertical}
button{border:0;border-radius:7px;padding:10px 16px;cursor:pointer;font-size:14px;background:#111827;color:#fff}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{background:#6b7280}.btn-danger{background:#dc2626}.btn-edit{background:#2563eb}
.product-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 15px}
.full-width{grid-column:1/-1}
.form-actions{display:flex;gap:10px;flex-wrap:wrap}
.products-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px}
.product-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;box-shadow:0 3px 10px rgba(0,0,0,.06)}
.product-card img{width:100%;height:190px;object-fit:contain;border-radius:8px;background:#fafafa;margin-bottom:10px}
.product-card h3{margin:5px 0 12px}.product-card p{margin:7px 0;color:#374151}
.product-actions{display:flex;gap:8px;margin-top:15px}.product-actions button{flex:1}
.price{font-size:18px;font-weight:bold}.mrp{text-decoration:line-through;color:#777!important}
.stock{font-weight:bold}.order-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 3px 10px rgba(0,0,0,.06)}
.order-card h3{margin-top:0}.order-card p{margin:7px 0;color:#374151}
.order-status-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:15px}
.order-status-row select{width:auto;margin:0}
.category-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:8px;background:#fafafa}
.category-name{font-weight:bold;color:#111827}
.category-actions{display:flex;gap:8px;flex-wrap:wrap}
.category-actions button{padding:7px 12px}
.status-badge{display:inline-flex;align-items:center;justify-content:center;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:bold;border:1px solid transparent}
.status-new{background:#f3f4f6;color:#374151;border-color:#d1d5db}
.status-confirmed{background:#dcfce7;color:#166534;border-color:#86efac}
.status-processing{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd}
.status-shipped{background:#fef3c7;color:#92400e;border-color:#fcd34d}
.status-delivered{background:#d1fae5;color:#065f46;border-color:#6ee7b7}
.status-cancelled{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
.loading,.empty{text-align:center;padding:30px;color:#666}.small-note{font-size:13px;color:#6b7280}
@media(max-width:900px){.products-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){
header{padding:15px 20px}.logo{font-size:22px}.admin-title{font-size:15px}
.admin-container{margin:20px auto;padding:0 12px}.product-form-grid{grid-template-columns:1fr}
.full-width{grid-column:auto}.products-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
<div class="logo">SEPLUS</div>
<div class="admin-title">Admin Panel</div>
</header>

<div class="admin-container">
<h1>Admin Panel</h1>
<div id="message"></div>
<div id="admin-user" class="admin-user">Checking login...</div>

<div class="section">
<h2>Category Management</h2>

<div style="display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;">
<div>
<label for="category-name">Category Name</label>
<input type="text" id="category-name" placeholder="e.g. PoE Switch">
</div>
<button type="button" id="add-category-btn">Add Category</button>
</div>

<div id="categories-list" style="margin-top:20px;">
<div class="loading">Loading categories...</div>
</div>
</div>

<div class="section">
<h2>Product Management</h2>

<form id="product-form">
<input type="hidden" id="product-id">

<div class="product-form-grid">
<div><label>Product Name</label><input type="text" id="product-name" placeholder="Product Name" required></div>

<div>
<label for="product-category">Category</label>
<select id="product-category" required>
<option value="">Select Category</option>
</select>
</div>

<div><label>Selling Price</label><input type="number" id="product-price" min="0" step="0.01" required></div>
<div><label>MRP</label><input type="number" id="product-mrp" min="0" step="0.01"></div>
<div><label>Stock</label><input type="number" id="product-stock" min="0" step="1" required></div>
<div><label>Product Image</label><input type="file" id="product-image-file" accept="image/*"><input type="hidden" id="product-image"><div id="image-preview" class="small-note">No new image selected.</div></div>
<div><label>Brand</label><input type="text" id="product-brand" placeholder="Hikvision"></div>
<div><label>Model</label><input type="text" id="product-model" placeholder="Model Number"></div>
<div><label>Warranty</label><input type="text" id="product-warranty" placeholder="1 Year"></div>

<div class="full-width"><label>Description</label><textarea id="product-description" placeholder="Product Description"></textarea></div>
<div class="full-width"><label>Specifications</label><textarea id="product-specs" placeholder="Product Specifications"></textarea></div>
</div>

<div class="form-actions">
<button type="submit" id="add-product-btn">Add Product</button>
<button type="button" id="cancel-edit-btn" class="btn-secondary" style="display:none">Cancel Edit</button>
</div>
<p class="small-note">Select a product image. It will be uploaded to Supabase Storage <b>product-images</b> automatically.</p>
</form>

<hr style="border:0;border-top:1px solid #e5e7eb;margin:25px 0">

<input type="text" id="product-search" placeholder="Search products...">
<div id="products-list" class="products-grid"><div class="loading">Loading products...</div></div>
</div>

<div class="section">
<h2>Order Management</h2>
<input type="text" id="order-search" placeholder="Search customer, mobile, email or order...">
<div id="orders"><div class="loading">Loading orders...</div></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://uxujlcahvnzohohnjclv.supabase.co";
const SUPABASE_KEY="sb_publishable_sna7FS8E7-w7pXG3_u-rRw__q2Dcv0_";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const ADMIN_USER_ID="1b43b097-d5e6-4352-8891-a0f76b08690b";
let currentUser=null;
let allOrders=[];
let allProducts=[];

function escapeHtml(value){
return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function showMessage(message,type="error"){
const box=document.getElementById("message");
box.innerHTML='<div class="'+type+'">'+escapeHtml(message)+'</div>';
setTimeout(()=>box.innerHTML="",4000);
}

function getProductImageUrl(image){
if(!image)return"";
if(image.startsWith("http://")||image.startsWith("https://")||image.startsWith("/"))return image;
return"images/"+image;
}

async function checkLogin(){
const {data:{user},error}=await supabaseClient.auth.getUser();

if(error||!user){
currentUser=null;
document.getElementById("admin-user").textContent="Please login to access Admin Panel.";
document.getElementById("products-list").innerHTML='<div class="empty">Please login first. Redirecting to login...</div>';
document.getElementById("orders").innerHTML='<div class="empty">Please login first. Redirecting to login...</div>';
setTimeout(()=>{
    window.location.href="login.html";
},1000);
return false;
}

currentUser=user;

if(user.id!==ADMIN_USER_ID){
document.getElementById("admin-user").textContent="Admin access required.";
document.getElementById("products-list").innerHTML='<div class="empty">Admin access required. Redirecting to Store...</div>';
document.getElementById("orders").innerHTML='<div class="empty">Admin access required. Redirecting to Store...</div>';
document.getElementById("product-form").style.display="none";
setTimeout(()=>{
    window.location.href="store.html";
},1000);
return false;
}

document.getElementById("admin-user").innerHTML="Logged in as Admin: <strong>"+escapeHtml(user.email||user.id)+"</strong>";
return true;
}

async function loadOrders(){
const container=document.getElementById("orders");
container.innerHTML='<div class="loading">Loading orders...</div>';

const {data,error}=await supabaseClient.from("orders").select("*").order("id",{ascending:false});

if(error){
console.error(error);
container.innerHTML='<div class="empty">Unable to load orders.</div>';
showMessage("Unable to load orders: "+error.message);
return;
}

allOrders=data||[];
displayOrders(allOrders);
}

function getStatusClass(status){
const value=String(status||"New Order").toLowerCase();
if(value==="confirmed")return"status-confirmed";
if(value==="processing")return"status-processing";
if(value==="shipped")return"status-shipped";
if(value==="delivered")return"status-delivered";
if(value==="cancelled")return"status-cancelled";
return"status-new";
}

function displayOrders(orders){
const container=document.getElementById("orders");

if(!orders||orders.length===0){
container.innerHTML='<div class="empty">No orders available.</div>';
return;
}

container.innerHTML="";

orders.forEach(order=>{
const products=Array.isArray(order.products)?order.products:[];
let productsHtml=products.length?'<ul>'+products.map(item=>
'<li>'+escapeHtml(item.name||"Product")+' × '+Number(item.quantity||1)+' — ₹'+Number(item.price||0).toLocaleString("en-IN")+'</li>'
).join("")+'</ul>':"<p>No product details.</p>";

const card=document.createElement("div");
card.className="order-card";
const status=order.status||"New Order";
const amount=Number(order.amount||0);

card.innerHTML=`
<h3>Order #${escapeHtml(order.id)}</h3>
<p><strong>Customer:</strong> ${escapeHtml(order.name||"-")}</p>
<p><strong>Mobile:</strong> ${escapeHtml(order.mobile||"-")}</p>
<p><strong>Email:</strong> ${escapeHtml(order.email||"-")}</p>
<p><strong>Address:</strong> ${escapeHtml(order.address||"-")}</p>
<p><strong>City:</strong> ${escapeHtml(order.city||"-")}</p>
<p><strong>State:</strong> ${escapeHtml(order.state||"-")}</p>
<p><strong>Pincode:</strong> ${escapeHtml(order.pincode||"-")}</p>
<p><strong>Products:</strong></p>
${productsHtml}
<p><strong>Total Amount:</strong> ₹${amount.toLocaleString("en-IN")}</p>
<p><strong>Date:</strong> ${escapeHtml(order.date||order.created_at||"-")}</p>
<p class="small-note">User ID: ${escapeHtml(order.user_id||"-")}</p>

<div class="order-status-row">
<strong>Status:</strong>
<span id="status-badge-${order.id}" class="status-badge ${getStatusClass(status)}">${escapeHtml(status)}</span>
<select id="status-${order.id}">
<option value="New Order" ${status==="New Order"?"selected":""}>New Order</option>
<option value="Confirmed" ${status==="Confirmed"?"selected":""}>Confirmed</option>
<option value="Processing" ${status==="Processing"?"selected":""}>Processing</option>
<option value="Shipped" ${status==="Shipped"?"selected":""}>Shipped</option>
<option value="Delivered" ${status==="Delivered"?"selected":""}>Delivered</option>
<option value="Cancelled" ${status==="Cancelled"?"selected":""}>Cancelled</option>
</select>
<button type="button" onclick="updateOrderStatus(${Number(order.id)})">Update Status</button>
</div>`;
container.appendChild(card);
});
}

async function updateOrderStatus(orderId) {

    if (!currentUser || currentUser.id !== ADMIN_USER_ID) {
        showMessage("Admin access required.");
        return;
    }

    const select = document.getElementById("status-" + orderId);

    if (!select) {
        return;
    }

    const newStatus = select.value;

    // Find current order details
    const order = allOrders.find(
        item => Number(item.id) === Number(orderId)
    );

    if (!order) {
        showMessage("Order not found.");
        return;
    }

    // Update order status in Supabase
    const { error } = await supabaseClient
        .from("orders")
        .update({
            status: newStatus
        })
        .eq("id", orderId);

    if (error) {
        showMessage(
            "Unable to update order status: " + error.message
        );
        return;
    }

    // Keep the current order data in sync immediately.
    order.status = newStatus;

    // -----------------------------------------
    // SEND STATUS UPDATE EMAIL
    // -----------------------------------------

    if (order.email) {

        let products = order.products || [];

        // If products is stored as JSON text
        if (typeof products === "string") {
            try {
                products = JSON.parse(products);
            } catch (e) {
                products = [];
            }
        }

        let productRows = "";

        products.forEach(item => {

            const quantity = Number(item.quantity || 1);
            const price = Number(item.price || 0);
            const total = price * quantity;

            productRows += `
                <tr>
                    <td style="padding:8px;border:1px solid #ddd;">
                        ${item.name || item.itemName || "Product"}
                    </td>

                    <td style="padding:8px;border:1px solid #ddd;text-align:center;">
                        ${quantity}
                    </td>

                    <td style="padding:8px;border:1px solid #ddd;text-align:right;">
                        ₹${price.toLocaleString("en-IN")}
                    </td>

                    <td style="padding:8px;border:1px solid #ddd;text-align:right;">
                        ₹${total.toLocaleString("en-IN")}
                    </td>
                </tr>
            `;
        });

        const subject =
            `SEPLUS - Order #${orderId} Status Updated`;

        const html = `
            <div style="
                font-family:Arial,sans-serif;
                max-width:600px;
                margin:auto;
                color:#222;
            ">

                <div style="
                    background:#111827;
                    color:white;
                    padding:18px;
                    font-size:20px;
                    font-weight:bold;
                ">
                    SEPLUS - Order Status Updated
                </div>

                <div style="padding:20px;">

                    <p>
                        Dear ${order.name || "Customer"},
                    </p>

                    <p>
                        Your order status has been updated.
                    </p>

                    <p>
                        <strong>Order ID:</strong> #${orderId}
                    </p>

                    <p>
                        <strong>Order Status:</strong>
                        <span style="
                            font-weight:bold;
                            color:#111827;
                        ">
                            ${newStatus}
                        </span>
                    </p>

                    <h3>Order Details</h3>

                    <table style="
                        width:100%;
                        border-collapse:collapse;
                        font-size:14px;
                    ">

                        <thead>
                            <tr>
                                <th style="
                                    padding:8px;
                                    border:1px solid #ddd;
                                    text-align:left;
                                ">
                                    Product
                                </th>

                                <th style="
                                    padding:8px;
                                    border:1px solid #ddd;
                                ">
                                    Qty
                                </th>

                                <th style="
                                    padding:8px;
                                    border:1px solid #ddd;
                                    text-align:right;
                                ">
                                    Price
                                </th>

                                <th style="
                                    padding:8px;
                                    border:1px solid #ddd;
                                    text-align:right;
                                ">
                                    Total
                                </th>
                            </tr>
                        </thead>

                        <tbody>
                            ${productRows}
                        </tbody>

                    </table>

                    <p style="
                        text-align:right;
                        font-size:18px;
                        font-weight:bold;
                        margin-top:20px;
                    ">
                        Total:
                        ₹${Number(order.amount || 0).toLocaleString("en-IN")}
                    </p>

                    <hr>

                    <p>
                        We will keep you updated about your order.
                    </p>

                    <p>
                        Regards,<br>
                        <strong>SEPLUS</strong>
                    </p>

                </div>
            </div>
        `;

        try {

            const { data: emailData, error: emailError } =
                await supabaseClient.functions.invoke(
                    "send-order-email",
                    {
                        body: {
                            to: order.email,
                            subject: subject,
                            html: html
                        }
                    }
                );

            if (emailError) {

                console.error(
                    "Status Email Error:",
                    emailError
                );

                showMessage(
                    "Order status updated, but email could not be sent.",
                    "success"
                );

            } else {

                console.log(
                    "Status email sent:",
                    emailData
                );

                showMessage(
                    "Order #" +
                    orderId +
                    " status updated to " +
                    newStatus +
                    " and email sent.",
                    "success"
                );
            }

        } catch (emailError) {

            console.error(
                "Status Email Exception:",
                emailError
            );

            showMessage(
                "Order status updated, but email could not be sent.",
                "success"
            );
        }

    } else {

        showMessage(
            "Order #" +
            orderId +
            " status updated to " +
            newStatus +
            ". Customer email not available.",
            "success"
        );
    }

    const badge = document.getElementById("status-badge-" + orderId);
    if (badge) {
        badge.textContent = newStatus;
        badge.className = "status-badge " + getStatusClass(newStatus);
    }

    await loadOrders();
}

document.getElementById("order-search").addEventListener("input",function(){
const searchText=this.value.toLowerCase().trim();
displayOrders(allOrders.filter(order=>{
const text=`${order.id||""} ${order.name||""} ${order.mobile||""} ${order.email||""} ${order.status||""}`.toLowerCase();
return text.includes(searchText);
}));
});

let allCategories=[];

async function loadCategories(){
    const list=document.getElementById("categories-list");
    const select=document.getElementById("product-category");
    if(!list || !select) return;
    list.innerHTML='<div class="loading">Loading categories...</div>';
    select.innerHTML='<option value="">Loading categories...</option>';

    const {data,error}=await supabaseClient.from("categories").select("id,name").order("id",{ascending:true});

    if(error){
        console.error("Categories Error:",error);
        list.innerHTML='<div class="empty">Unable to load categories.</div>';
        select.innerHTML='<option value="">Unable to load categories</option>';
        showMessage("Unable to load categories: " + error.message);
        return;
    }

    allCategories=data||[];
    if(allCategories.length===0){
        list.innerHTML='<div class="empty">No categories available.</div>';
        select.innerHTML='<option value="">No categories available</option>';
        return;
    }

    select.innerHTML='<option value="">Select Category</option>';
    allCategories.forEach(category=>{
        const option=document.createElement("option");
        option.value=category.name;
        option.textContent=category.name;
        select.appendChild(option);
    });

    list.innerHTML="";
    allCategories.forEach(category=>{
        const row=document.createElement("div");
        row.className="category-row";
        const nameSpan=document.createElement("span");
        nameSpan.className="category-name";
        nameSpan.textContent=category.name;
        row.appendChild(nameSpan);
        const actions=document.createElement("div");
        actions.className="category-actions";
        const editBtn=document.createElement("button");
        editBtn.type="button";
        editBtn.className="btn-edit";
        editBtn.textContent="Edit";
        editBtn.onclick = function(event){
            event.preventDefault();
            event.stopPropagation();
            openCategoryEditDialog(category.id);
        };
        const deleteBtn=document.createElement("button");
        deleteBtn.type="button";
        deleteBtn.className="btn-danger";
        deleteBtn.textContent="Delete";
        deleteBtn.addEventListener("click",()=>window.deleteCategory(category.id));
        actions.appendChild(editBtn);
        actions.appendChild(deleteBtn);
        row.appendChild(actions);
        list.appendChild(row);
    });
}

async function addCategory(){
    if(!currentUser || currentUser.id!==ADMIN_USER_ID){ showMessage("Admin access required."); return; }
    const input=document.getElementById("category-name");
    const button=document.getElementById("add-category-btn");
    const name=input.value.trim();
    if(!name){ showMessage("Please enter a category name."); input.focus(); return; }
    button.disabled=true;
    const {error}=await supabaseClient.from("categories").insert([{name:name}]);
    button.disabled=false;
    if(error){
        console.error("Category add error:",error);
        showMessage(error.code==="23505" ? "This category already exists." : "Unable to add category: " + error.message);
        return;
    }
    input.value="";
    showMessage("Category added successfully.","success");
    await loadCategories();
}

window.editCategory = function editCategory(categoryId){
    openCategoryEditDialog(categoryId);
}

async function openCategoryEditDialog(categoryId){
    if(!currentUser || currentUser.id!==ADMIN_USER_ID){
        showMessage("Admin access required.");
        return;
    }

    const category=allCategories.find(item=>Number(item.id)===Number(categoryId));
    if(!category){
        showMessage("Category not found. Please refresh the page.");
        return;
    }

    const existing=document.getElementById("category-edit-modal");
    if(existing) existing.remove();

    const overlay=document.createElement("div");
    overlay.id="category-edit-modal";
    overlay.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:99999;padding:20px;";

    const box=document.createElement("div");
    box.style.cssText="width:min(420px,100%);background:#fff;border-radius:12px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25);font-family:Arial,sans-serif;";

    const title=document.createElement("h3");
    title.textContent="Edit Category";
    title.style.cssText="margin:0 0 8px;font-size:20px;color:#111827;";

    const label=document.createElement("label");
    label.textContent="Category Name";
    label.style.cssText="display:block;margin:12px 0 6px;font-weight:600;color:#374151;";

    const input=document.createElement("input");
    input.type="text";
    input.value=category.name||"";
    input.style.cssText="width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #d1d5db;border-radius:7px;font-size:15px;outline:none;";

    const errorText=document.createElement("div");
    errorText.style.cssText="min-height:20px;margin-top:7px;color:#dc2626;font-size:13px;";

    const actions=document.createElement("div");
    actions.style.cssText="display:flex;justify-content:flex-end;gap:8px;margin-top:12px;";

    const cancelBtn=document.createElement("button");
    cancelBtn.type="button";
    cancelBtn.textContent="Cancel";
    cancelBtn.style.cssText="padding:9px 16px;border:1px solid #d1d5db;border-radius:7px;background:#fff;color:#374151;cursor:pointer;";

    const saveBtn=document.createElement("button");
    saveBtn.type="button";
    saveBtn.textContent="Save";
    saveBtn.style.cssText="padding:9px 16px;border:0;border-radius:7px;background:#2563eb;color:#fff;cursor:pointer;";

    const closeModal=()=>overlay.remove();
    cancelBtn.addEventListener("click",closeModal);
    overlay.addEventListener("click",event=>{
        if(event.target===overlay) closeModal();
    });

    saveBtn.addEventListener("click",async()=>{
        const name=input.value.trim();
        errorText.textContent="";

        if(!name){
            errorText.textContent="Category name cannot be empty.";
            input.focus();
            return;
        }

        if(name===category.name){
            closeModal();
            return;
        }

        saveBtn.disabled=true;
        cancelBtn.disabled=true;
        saveBtn.textContent="Saving...";

        const {error}=await supabaseClient
            .from("categories")
            .update({name:name})
            .eq("id",Number(categoryId));

        if(error){
            console.error("Category update error:",error);
            saveBtn.disabled=false;
            cancelBtn.disabled=false;
            saveBtn.textContent="Save";
            errorText.textContent=error.code==="23505"
                ? "This category already exists."
                : "Unable to update category: " + error.message;
            return;
        }

        closeModal();
        showMessage("Category updated successfully.","success");
        await loadCategories();
    });

    input.addEventListener("keydown",event=>{
        if(event.key==="Enter") saveBtn.click();
        if(event.key==="Escape") closeModal();
    });

    actions.appendChild(cancelBtn);
    actions.appendChild(saveBtn);
    box.appendChild(title);
    box.appendChild(label);
    box.appendChild(input);
    box.appendChild(errorText);
    box.appendChild(actions);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    input.focus();
    input.select();
}

window.deleteCategory = async function deleteCategory(categoryId){
    if(!currentUser || currentUser.id!==ADMIN_USER_ID){ showMessage("Admin access required."); return; }

    const confirmed=confirm("Delete category \""+category.name+"\"?\n\nExisting products will not be deleted, but products already using this category will keep the old category text.");
    if(!confirmed) return;

document.getElementById("add-category-btn").addEventListener("click",addCategory);

async function uploadProductImage(file){
    if(!file) return null;

    if(!file.type || !file.type.startsWith("image/")){
        throw new Error("Please select a valid image file.");
    }

    const maxSize = 5 * 1024 * 1024;
    if(file.size > maxSize){
        throw new Error("Image size must be 5 MB or less.");
    }

    const originalName = file.name || "image";
    const extension = originalName.includes(".")
        ? originalName.split(".").pop().toLowerCase()
        : "jpg";

    const safeName =
        "product-" +
        Date.now() + "-" +
        Math.random().toString(36).slice(2, 8) +
        "." + extension;

    const { data, error } = await supabaseClient
        .storage
        .from("product-images")
        .upload(safeName, file, {
            cacheControl: "3600",
            upsert: false
        });

    if(error){
        throw new Error("Image upload failed: " + error.message);
    }

    const { data: publicData } = supabaseClient
        .storage
        .from("product-images")
        .getPublicUrl(data.path);

    if(!publicData || !publicData.publicUrl){
        throw new Error("Unable to create image URL.");
    }

    return publicData.publicUrl;
}

async function loadProducts(){
const container=document.getElementById("products-list");
container.innerHTML='<div class="loading">Loading products...</div>';

const {data,error}=await supabaseClient.from("products").select("*").order("id",{ascending:false});

if(error){
console.error(error);
container.innerHTML='<div class="empty">Unable to load products.</div>';
showMessage("Unable to load products: "+error.message);
return;
}

allProducts=data||[];
displayProducts(allProducts);
}

function displayProducts(products){
const container=document.getElementById("products-list");

if(!products||products.length===0){
container.innerHTML='<div class="empty">No products available.</div>';
return;
}

container.innerHTML="";

products.forEach(product=>{
const price=Number(product.price||0);
const mrp=Number(product.mrp||0);
const stock=Number(product.stock||0);
const imageUrl=getProductImageUrl(product.image);

const card=document.createElement("div");
card.className="product-card";

card.innerHTML=`
${imageUrl?`<img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(product.name||"Product")}" onerror="this.style.display='none'">`:""}
<h3>${escapeHtml(product.name||"Product")}</h3>
<p class="price">₹${price.toLocaleString("en-IN")}</p>
${mrp>0?`<p class="mrp">MRP: ₹${mrp.toLocaleString("en-IN")}</p>`:""}
<p><strong>Category:</strong> ${escapeHtml(product.category||"-")}</p>
<p><strong>Brand:</strong> ${escapeHtml(product.brand||"-")}</p>
<p><strong>Model:</strong> ${escapeHtml(product.model||"-")}</p>
<p><strong>Warranty:</strong> ${escapeHtml(product.warranty||"-")}</p>
<p class="stock"><strong>Stock:</strong> ${stock}</p>
<div class="product-actions">
<button type="button" class="btn-edit" onclick="editProduct(${Number(product.id)})">Edit Product</button>
<button type="button" class="btn-danger" onclick="deleteProduct(${Number(product.id)})">Delete</button>
</div>`;
container.appendChild(card);
});
}

document.getElementById("product-search").addEventListener("input",function(){
const searchText=this.value.toLowerCase().trim();
displayProducts(allProducts.filter(product=>{
const text=`${product.name||""} ${product.category||""} ${product.brand||""} ${product.model||""}`.toLowerCase();
return text.includes(searchText);
}));
});

document.getElementById("product-form").addEventListener("submit",async function(event){
event.preventDefault();

if(!currentUser||currentUser.id!==ADMIN_USER_ID){
showMessage("Admin access required.");
return;
}

const productId=document.getElementById("product-id").value.trim();
const name=document.getElementById("product-name").value.trim();
const category=document.getElementById("product-category").value.trim();
const price=Number(document.getElementById("product-price").value);
const mrpValue=document.getElementById("product-mrp").value;
const mrp=mrpValue===""?null:Number(mrpValue);
const stock=Number(document.getElementById("product-stock").value);
const imageInput=document.getElementById("product-image-file");
const existingImage=document.getElementById("product-image").value.trim();
const brand=document.getElementById("product-brand").value.trim();
const model=document.getElementById("product-model").value.trim();
const warranty=document.getElementById("product-warranty").value.trim();
const description=document.getElementById("product-description").value.trim();
const specs=document.getElementById("product-specs").value.trim();

if(!name||!category||Number.isNaN(price)||Number.isNaN(stock)){
showMessage("Please fill Product Name, Category, Price and Stock.");
return;
}

const button=document.getElementById("add-product-btn");
button.disabled=true;

try {

    let image = existingImage;

    // New product requires an image.
    if(!productId && (!imageInput || !imageInput.files[0])){
        throw new Error("Please select a product image.");
    }

    // If a new image is selected, upload it to Supabase Storage first.
    if(imageInput && imageInput.files[0]){
        showMessage("Uploading product image...","success");
        image = await uploadProductImage(imageInput.files[0]);
    }

    const productData={
        name,
        price,
        mrp,
        stock,
        category,
        image,
        brand,
        model,
        warranty,
        description,
        specs
    };

    let result;

    if(productId){
        result=await supabaseClient
            .from("products")
            .update(productData)
            .eq("id",Number(productId));
    }else{
        result=await supabaseClient
            .from("products")
            .insert([productData]);
    }

    if(result.error){
        throw new Error("Product save failed: " + result.error.message);
    }

    showMessage(
        productId
            ? "Product updated successfully."
            : "Product added successfully with image.",
        "success"
    );

    resetProductForm();
    await loadProducts();

} catch(error) {

    console.error("Product save error:", error);

    showMessage(
        error && error.message
            ? error.message
            : "Unable to save product."
    );

} finally {
    button.disabled=false;
}
});

function editProduct(productId){
const product=allProducts.find(item=>Number(item.id)===Number(productId));

if(!product){
showMessage("Product not found.");
return;
}

document.getElementById("product-id").value=product.id;
document.getElementById("product-name").value=product.name||"";
const categorySelect=document.getElementById("product-category");
const productCategory=product.category||"";
if(productCategory && !Array.from(categorySelect.options).some(option=>option.value===productCategory)){
    const option=document.createElement("option");
    option.value=productCategory;
    option.textContent=productCategory + " (existing)";
    categorySelect.appendChild(option);
}
categorySelect.value=productCategory;
document.getElementById("product-price").value=product.price??"";
document.getElementById("product-mrp").value=product.mrp??"";
document.getElementById("product-stock").value=product.stock??0;
document.getElementById("product-image").value=product.image||"";
document.getElementById("product-brand").value=product.brand||"";
document.getElementById("product-model").value=product.model||"";
document.getElementById("product-warranty").value=product.warranty||"";
document.getElementById("product-description").value=product.description||"";
document.getElementById("product-specs").value=product.specs||"";

document.getElementById("add-product-btn").textContent="Update Product";
document.getElementById("cancel-edit-btn").style.display="inline-block";

document.getElementById("product-form").scrollIntoView({behavior:"smooth",block:"start"});
}

async function deleteProduct(productId){
if(!currentUser||currentUser.id!==ADMIN_USER_ID){
showMessage("Admin access required.");
return;
}

const product=allProducts.find(item=>Number(item.id)===Number(productId));
if(!product)return;

if(!confirm(`Delete "${product.name}"?\n\nThis action cannot be undone.`))return;

const {error}=await supabaseClient.from("products").delete().eq("id",Number(productId));

if(error){
showMessage("Product delete failed: "+error.message);
return;
}

showMessage("Product deleted successfully.","success");
resetProductForm();
await loadProducts();
}

function resetProductForm(){
document.getElementById("product-form").reset();
document.getElementById("product-id").value="";
document.getElementById("product-stock").value="0";
document.getElementById("add-product-btn").textContent="Add Product";
document.getElementById("cancel-edit-btn").style.display="none";
}

document.getElementById("product-image-file").addEventListener("change",function(){
    const file=this.files[0];
    const preview=document.getElementById("image-preview");

    if(!file){
        preview.textContent="No new image selected.";
        return;
    }

    preview.textContent="Selected: " + file.name + " (" + Math.round(file.size / 1024) + " KB)";
});

document.getElementById("cancel-edit-btn").addEventListener("click",resetProductForm);

async function startAdmin(){
const isAdmin=await checkLogin();
if(!isAdmin)return;
await loadCategories();
await loadProducts();
await loadOrders();
}

startAdmin();
