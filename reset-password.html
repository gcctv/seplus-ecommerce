<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - SEPLUS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
        }

        .reset-container {
            width: 100%;
            max-width: 420px;
            margin: 80px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .reset-container h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .reset-container p {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #111827;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="reset-container">

    <h1>SEPLUS</h1>

    <p>Reset Your Password</p>

    <form id="resetForm">

        <label for="password">New Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter new password"
            required
            minlength="6"
        >

        <label for="confirmPassword">Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            required
            minlength="6"
        >

        <button type="submit">
            Update Password
        </button>

    </form>

    <div id="message"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://uxujlcahvnzohohnjclv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_sna7FS8E7-w7pXG3_u-rRw__q2Dcv0_";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

document.getElementById("resetForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("message");

    if (password !== confirmPassword) {

        message.textContent = "Passwords do not match.";
        return;
    }

    message.textContent = "Updating password...";

    const { error } =
        await supabaseClient.auth.updateUser({
            password: password
        });

    if (error) {

        console.error("Password update error:", error);

        message.textContent = error.message;
        return;
    }

    message.textContent =
        "Password updated successfully!";

    setTimeout(function() {
        window.location.href = "login.html";
    }, 2000);

});

</script>

</body>
</html>
