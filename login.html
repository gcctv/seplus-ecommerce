<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEPLUS - Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8}
.login-container{width:100%;max-width:420px;margin:60px auto;padding:35px;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{text-align:center;margin-bottom:10px}
.subtitle{text-align:center;color:#666;margin-bottom:30px}
label{display:block;margin-bottom:7px;font-weight:bold}
input{width:100%;padding:12px;margin-bottom:16px;border:1px solid #ccc;border-radius:6px;font-size:15px}
button{width:100%;padding:13px;border:0;border-radius:6px;background:#111827;color:#fff;font-size:16px;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.login-tabs{display:flex;gap:8px;margin-bottom:22px}
.tab-btn{width:50%;padding:11px 8px;background:#eef2f7;color:#111827;border:1px solid #d1d5db}
.tab-btn.active{background:#111827;color:#fff}
.secondary-button{background:#6b7280;margin-top:10px}
.link-button{background:none;color:#2563eb;padding:5px;margin-top:8px}
#message{text-align:center;margin-top:15px;font-weight:bold;min-height:20px}
.signup-link{margin-top:20px;text-align:center}
.signup-link a{color:#2563eb;text-decoration:none}
.help-text{text-align:center;color:#666;font-size:13px;margin-top:8px}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="login-container">
<h1>SEPLUS</h1>
<p class="subtitle">Customer / Admin Login</p>

<div class="login-tabs">
<button type="button" class="tab-btn active" id="emailTab">Email Login</button>
<button type="button" class="tab-btn" id="mobileTab">Mobile Login</button>
</div>

<!-- EMAIL LOGIN -->
<form id="loginForm">
<label for="email">Email</label>
<input type="email" id="email" placeholder="Enter your email" required>

<label for="password">Password</label>
<input type="password" id="password" placeholder="Enter your password" required>

<button type="submit" id="loginButton">Login</button>

<div style="text-align:center;margin-top:12px">
<a href="#" id="forgotPassword">Forgot Password?</a>
</div>
</form>

<!-- MOBILE PASSWORD LOGIN -->
<form id="mobileLoginForm" class="hidden">
<label for="mobile">Mobile Number</label>
<input type="tel" id="mobile" placeholder="Enter 10 digit mobile number" inputmode="tel" autocomplete="tel">

<label for="mobilePassword">Password</label>
<input type="password" id="mobilePassword" placeholder="Enter your password" autocomplete="current-password">

<button type="submit" id="mobileLoginButton">Login with Mobile</button>

<div style="text-align:center;margin-top:12px">
<button type="button" class="link-button" id="otpResetButton">
First time / Forgot password? Verify with OTP
</button>
</div>
</form>

<!-- OTP SET/RESET FLOW -->
<div id="otpPanel" class="hidden">

<label for="otpPhone">Mobile Number</label>
<input type="tel" id="otpPhone" placeholder="Enter 10 digit mobile number" inputmode="tel">

<button type="button" id="sendOtpButton">Send OTP</button>

<div id="otpVerifySection" class="hidden" style="margin-top:18px">
<label for="otp">Enter OTP</label>
<input type="text" id="otp" placeholder="6-digit OTP" inputmode="numeric" autocomplete="one-time-code" maxlength="6">

<button type="button" id="verifyOtpButton">Verify OTP</button>

<div id="newPasswordSection" class="hidden" style="margin-top:18px">
<label for="newPassword">Create New Password</label>
<input type="password" id="newPassword" placeholder="Minimum 6 characters">

<label for="confirmPassword">Confirm Password</label>
<input type="password" id="confirmPassword" placeholder="Re-enter password">

<button type="button" id="savePasswordButton">Save Password</button>
</div>

<button type="button" class="secondary-button" id="backToMobileLoginButton">Back to Mobile Login</button>
</div>

<p class="help-text">OTP is required only for first-time password setup or password recovery.</p>
</div>

<div id="message"></div>

<div class="signup-link">
Don't have an account?
<a href="signup.html">Create Account</a>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://uxujlcahvnzohohnjclv.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_sna7FS8E7-w7pXG3_u-rRw__q2Dcv0_";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const ADMIN_USER_ID="1b43b097-d5e6-4352-8891-a0f76b08690b";

const loginForm=document.getElementById("loginForm");
const mobileLoginForm=document.getElementById("mobileLoginForm");
const otpPanel=document.getElementById("otpPanel");
const emailTab=document.getElementById("emailTab");
const mobileTab=document.getElementById("mobileTab");
const message=document.getElementById("message");

function routeUser(user){
    if(!user){message.textContent="Login successful, but user information was not found.";return;}
    if(user.id===ADMIN_USER_ID) window.location.href="admin.html";
    else window.location.href="store.html";
}

function normalizeIndianPhone(value){
    let phone=String(value||"").trim().replace(/[^\d+]/g,"");
    if(phone.startsWith("0")) phone="+91"+phone.substring(1);
    else if(/^91\d{10}$/.test(phone)) phone="+"+phone;
    else if(/^\d{10}$/.test(phone)) phone="+91"+phone;
    return phone;
}

function isValidIndianPhone(phone){
    return /^\+91[6-9]\d{9}$/.test(phone);
}

emailTab.addEventListener("click",()=>{
    emailTab.classList.add("active"); mobileTab.classList.remove("active");
    loginForm.classList.remove("hidden"); mobileLoginForm.classList.add("hidden"); otpPanel.classList.add("hidden");
    message.textContent="";
});

mobileTab.addEventListener("click",()=>{
    mobileTab.classList.add("active"); emailTab.classList.remove("active");
    loginForm.classList.add("hidden"); mobileLoginForm.classList.remove("hidden"); otpPanel.classList.add("hidden");
    message.textContent="";
});

/* Email login */
loginForm.addEventListener("submit",async(e)=>{
    e.preventDefault();
    const email=document.getElementById("email").value.trim();
    const password=document.getElementById("password").value;
    const btn=document.getElementById("loginButton");
    btn.disabled=true; message.textContent="Logging in...";
    const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
    if(error){message.textContent=error.message;btn.disabled=false;return;}
    routeUser(data.user);
});

/* Email password reset */
document.getElementById("forgotPassword").addEventListener("click",async(e)=>{
    e.preventDefault();
    const email=document.getElementById("email").value.trim();
    if(!email){message.textContent="Please enter your email address first.";return;}
    message.textContent="Sending password reset email...";
    const resetUrl=new URL("reset-password.html",window.location.href).href;
    const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:resetUrl});
    message.textContent=error?error.message:"Password reset email sent. Please check your email.";
});

/* Mobile + password login */
mobileLoginForm.addEventListener("submit",async(e)=>{
    e.preventDefault();
    const phone=normalizeIndianPhone(document.getElementById("mobile").value);
    const password=document.getElementById("mobilePassword").value;
    const btn=document.getElementById("mobileLoginButton");

    if(!isValidIndianPhone(phone)){message.textContent="Please enter a valid Indian mobile number.";return;}
    if(!password){message.textContent="Please enter your password.";return;}

    btn.disabled=true; message.textContent="Logging in...";
    const {data,error}=await supabaseClient.auth.signInWithPassword({phone,password});

    if(error){
        console.error("Mobile password login error:",error);
        message.textContent=error.message;
        btn.disabled=false;
        return;
    }
    routeUser(data.user);
});

/* Open OTP setup/recovery */
document.getElementById("otpResetButton").addEventListener("click",()=>{
    const current=normalizeIndianPhone(document.getElementById("mobile").value);
    document.getElementById("otpPhone").value=isValidIndianPhone(current)?current:"";
    mobileLoginForm.classList.add("hidden");
    otpPanel.classList.remove("hidden");
    message.textContent="";
});

/* Send OTP */
document.getElementById("sendOtpButton").addEventListener("click",async()=>{
    const phone=normalizeIndianPhone(document.getElementById("otpPhone").value);
    const btn=document.getElementById("sendOtpButton");

    if(!isValidIndianPhone(phone)){message.textContent="Please enter a valid Indian mobile number.";return;}

    btn.disabled=true; message.textContent="Sending OTP...";
    const {error}=await supabaseClient.auth.signInWithOtp({phone});

    if(error){
        console.error("OTP error:",error);
        message.textContent=error.message;
        btn.disabled=false;
        return;
    }

    document.getElementById("otpPhone").value=phone;
    document.getElementById("otpVerifySection").classList.remove("hidden");
    document.getElementById("otp").focus();
    message.textContent="OTP sent. Please enter the 6-digit OTP.";
    btn.disabled=false;
});

/* Verify OTP only for setup/recovery */
document.getElementById("verifyOtpButton").addEventListener("click",async()=>{
    const phone=normalizeIndianPhone(document.getElementById("otpPhone").value);
    const otp=document.getElementById("otp").value.trim();
    const btn=document.getElementById("verifyOtpButton");

    if(!isValidIndianPhone(phone)){message.textContent="Please enter a valid mobile number.";return;}
    if(!/^\d{6}$/.test(otp)){message.textContent="Please enter the 6-digit OTP.";return;}

    btn.disabled=true; message.textContent="Verifying OTP...";

    const {data,error}=await supabaseClient.auth.verifyOtp({phone,token:otp,type:"sms"});

    if(error){
        console.error("OTP verification error:",error);
        message.textContent=error.message;
        btn.disabled=false;
        return;
    }

    if(!data.user){
        message.textContent="OTP verified, but user information was not found.";
        btn.disabled=false;
        return;
    }

    document.getElementById("newPasswordSection").classList.remove("hidden");
    message.textContent="OTP verified. Please create your mobile login password.";
});

/* Save mobile password */
document.getElementById("savePasswordButton").addEventListener("click",async()=>{
    const password=document.getElementById("newPassword").value;
    const confirm=document.getElementById("confirmPassword").value;
    const btn=document.getElementById("savePasswordButton");

    if(password.length<6){message.textContent="Password must be at least 6 characters.";return;}
    if(password!==confirm){message.textContent="Passwords do not match.";return;}

    btn.disabled=true; message.textContent="Saving password...";

    const {data,error}=await supabaseClient.auth.updateUser({password});

    if(error){
        console.error("Password update error:",error);
        message.textContent=error.message;
        btn.disabled=false;
        return;
    }

    message.textContent="Password saved successfully. You can now login with mobile number and password.";

    setTimeout(()=>{
        document.getElementById("otpPanel").classList.add("hidden");
        mobileLoginForm.classList.remove("hidden");
        document.getElementById("mobile").value=document.getElementById("otpPhone").value;
        document.getElementById("mobilePassword").value="";
        document.getElementById("otp").value="";
        document.getElementById("newPassword").value="";
        document.getElementById("confirmPassword").value="";
        document.getElementById("otpVerifySection").classList.add("hidden");
        document.getElementById("newPasswordSection").classList.add("hidden");
        message.textContent="Password saved. Enter your mobile number and password to login.";
    },800);
});

/* Back */
document.getElementById("backToMobileLoginButton").addEventListener("click",()=>{
    otpPanel.classList.add("hidden");
    mobileLoginForm.classList.remove("hidden");
    message.textContent="";
});
</script>
</body>
</html>
