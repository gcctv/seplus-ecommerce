<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SEPLUS - Login</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            margin: 80px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .login-container h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .login-container p {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #111827;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover { opacity: 0.9; }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .signup-link {
            margin-top: 20px;
            text-align: center;
        }

        .signup-link a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>SEPLUS</h1>

    <p>Customer / Admin Login</p>

    <form id="loginForm">

        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit" id="loginButton">Login</button>

        <div style="text-align:center; margin-top:12px;">
            <a href="#" id="forgotPassword">Forgot Password?</a>
        </div>

    </form>

    <div id="message"></div>

    <div class="signup-link">
        Don't have an account?
        <a href="signup.html">Create Account</a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://uxujlcahvnzohohnjclv.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_sna7FS8E7-w7pXG3_u-rRw__q2Dcv0_";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

// IMPORTANT: This must match the Admin Auth user's UUID
const ADMIN_USER_ID = "1b43b097-d5e6-4352-8891-a0f76b08690b";

document.getElementById("loginForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");

    message.textContent = "Logging in...";
    loginButton.disabled = true;

    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        console.error("Login error:", error);
        message.textContent = error.message;
        loginButton.disabled = false;
        return;
    }

    const user = data.user;

    if (!user) {
        message.textContent = "Login successful, but user information was not found.";
        loginButton.disabled = false;
        return;
    }

    message.textContent = "Login successful!";

    // Separate Admin and Customer routing
    if (user.id === ADMIN_USER_ID) {
        window.location.href = "admin.html";
    } else {
        window.location.href = "store.html";
    }
});

document.getElementById("forgotPassword").addEventListener("click", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const message = document.getElementById("message");

    if (!email) {
        message.textContent = "Please enter your email address first.";
        return;
    }

    message.textContent = "Sending password reset email...";

    // Resolve reset-password.html relative to the current login page.
    // This works on GitHub Pages, localhost and a custom domain.
    const resetUrl = new URL("reset-password.html", window.location.href).href;

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: resetUrl
    });

    if (error) {
        console.error("Password reset error:", error);
        message.textContent = error.message;
        return;
    }

    message.textContent = "Password reset email sent. Please check your email.";
});
</script>

</body>
</html>
