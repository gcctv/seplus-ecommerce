<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - SEPLUS</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .mobile-verify { display: flex; gap: 10px; align-items: stretch; }
        .mobile-verify input { flex: 1; }
        #verify-mobile-btn { width: auto; min-width: 130px; background: #16a34a; }
        #verify-mobile-btn:hover { background: #15803d; }
        .verify-status { margin-top: 8px; font-size: 14px; font-weight: 600; }
        .verify-success { color: #166534; }
        .verify-pending { color: #92400e; }
        .otp-box { display: none; margin-top: 10px; }
        .otp-row { display: flex; gap: 10px; }
        #otp-input { flex: 1; letter-spacing: 4px; text-align: center; font-weight: bold; }
        #confirm-otp-btn { width: auto; min-width: 130px; background: #2563eb; }

        @media (max-width: 600px) {
            .mobile-verify, .otp-row { flex-direction: column; }
            #verify-mobile-btn, #confirm-otp-btn { width: 100%; }
        }

        #message {
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 7px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .loading {
            text-align: center;
            color: #555;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px 12px;
                padding: 20px;
            }

            header {
                padding: 14px 15px;
            }

            .nav a {
                margin-left: 10px;
                font-size: 14px;
            }

            .logo {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">SEPLUS</div>

    <div class="nav">
        <a href="store.html">Store</a>
        <a href="my-orders.html">My Orders</a>
    </div>
</header>


<div class="container">

    <h2>My Profile & Saved Address</h2>

    <div id="loading" class="loading">
        Loading profile...
    </div>

    <div id="message"></div>

    <form id="profile-form">

        <div class="form-group">
            <label for="full-name">Full Name *</label>
            <input
                type="text"
                id="full-name"
                placeholder="Enter your full name"
                required
            >
        </div>


        <div class="form-group">
            <label for="mobile">Mobile Number *</label>
            <div class="mobile-verify">
                <input type="tel" id="mobile" placeholder="Enter 10 digit mobile number" maxlength="10" required>
                <button type="button" id="verify-mobile-btn">Verify Mobile</button>
            </div>
            <div id="verify-status" class="verify-status verify-pending">Mobile number is not verified.</div>
            <div id="otp-box" class="otp-box">
                <div class="otp-row">
                    <input type="text" id="otp-input" placeholder="Enter 6 digit OTP" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
                    <button type="button" id="confirm-otp-btn">Verify OTP</button>
                </div>
            </div>
        </div>


        <div class="form-group">
            <label for="address">Address *</label>
            <textarea
                id="address"
                placeholder="House No, Street, Area..."
                required
            ></textarea>
        </div>


        <div class="form-group">
            <label for="city">City *</label>
            <input
                type="text"
                id="city"
                placeholder="Enter city"
                required
            >
        </div>


        <div class="form-group">
            <label for="state">State *</label>
            <input
                type="text"
                id="state"
                placeholder="Enter state"
                required
            >
        </div>


        <div class="form-group">
            <label for="pincode">Pincode *</label>
            <input
                type="text"
                id="pincode"
                placeholder="Enter 6 digit pincode"
                maxlength="6"
                required
            >
        </div>


        <button type="submit" id="save-btn">
            Save Address
        </button>

    </form>

</div>


<script>

    // ================================
    // SUPABASE CONNECTION
    // ================================

    const SUPABASE_URL =
        "https://uxujlcahvnzohohnjclv.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_sna7FS8E7-w7pXG3_u-rRw__q2Dcv0_";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    // ================================
    // ELEMENTS
    // ================================

    const form = document.getElementById("profile-form");

    const loading =
        document.getElementById("loading");

    const message =
        document.getElementById("message");

    const saveBtn =
        document.getElementById("save-btn");

    const mobileInput = document.getElementById("mobile");
    const verifyMobileBtn = document.getElementById("verify-mobile-btn");
    const verifyStatus = document.getElementById("verify-status");
    const otpBox = document.getElementById("otp-box");
    const otpInput = document.getElementById("otp-input");
    const confirmOtpBtn = document.getElementById("confirm-otp-btn");

    let currentUser = null;
    let pendingPhone = null;
    let mobileVerified = false;


    // ================================
    // SHOW MESSAGE
    // ================================

    function showMessage(text, type) {

        message.textContent = text;

        message.className = type;

        message.style.display = "block";

    }


    // ================================
    // MOBILE OTP VERIFICATION
    // ================================

    function normalizeIndianPhone(value) {
        const digits = String(value || "").replace(/\D/g, "");
        if (digits.length === 10 && /^[6-9]/.test(digits)) return "+91" + digits;
        if (digits.length === 12 && digits.startsWith("91")) return "+" + digits;
        return null;
    }

    // Supabase/Auth may display/store the phone as 919052688596 or
    // +919052688596. Compare both forms using the final 10 digits.
    function indianPhoneDigits(value) {
        const digits = String(value || "").replace(/\D/g, "");
        if (digits.length === 10 && /^[6-9]/.test(digits)) return digits;
        if (digits.length === 12 && digits.startsWith("91")) return digits.slice(2);
        return null;
    }

    function setVerificationStatus(text, type = "pending") {
        verifyStatus.textContent = text;
        verifyStatus.className = "verify-status " + (type === "success" ? "verify-success" : "verify-pending");
    }

    async function refreshAuthPhoneStatus(user) {
        try {
            // getUser() reads the authenticated user from Supabase Auth.
            // Do not force refreshSession() here; immediately after phone_change
            // verification it can briefly return stale session information.
            const {
                data: { user: freshUser },
                error
            } = await supabaseClient.auth.getUser();

            if (error) {
                console.error("Auth user check error:", error);
            }

            currentUser = freshUser || user;

            const currentPhone = indianPhoneDigits(currentUser?.phone);
            const profilePhone = indianPhoneDigits(mobileInput.value);

            mobileVerified = !!currentPhone && !!profilePhone && currentPhone === profilePhone;

            setVerificationStatus(
                mobileVerified
                    ? "✓ Mobile number verified"
                    : "Mobile number is not verified.",
                mobileVerified ? "success" : "pending"
            );

            return currentUser;
        } catch (error) {
            console.error("Auth phone check error:", error);
            mobileVerified = false;
            setVerificationStatus("Mobile number is not verified.", "pending");
            return user;
        }
    }

    verifyMobileBtn.addEventListener("click", async function() {
        const phone = normalizeIndianPhone(mobileInput.value);
        if (!phone) { setVerificationStatus("Please enter a valid 10 digit Indian mobile number."); return; }
        const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
        if (userError || !user) { window.location.href = "login.html"; return; }
        currentUser = user; pendingPhone = phone;
        verifyMobileBtn.disabled = true; verifyMobileBtn.textContent = "Sending OTP...";
        try {
            const { error } = await supabaseClient.auth.updateUser({ phone });
            if (error) {
                console.error("Send Mobile OTP Error:", error);
                setVerificationStatus(error.message || "Unable to send OTP. Please try again.");
                return;
            }
            otpBox.style.display = "block"; otpInput.focus();
            setVerificationStatus("OTP sent to " + phone + ". Enter the OTP below.");
        } catch (error) {
            console.error(error); setVerificationStatus("Unable to send OTP. Please try again.");
        } finally {
            verifyMobileBtn.disabled = false; verifyMobileBtn.textContent = "Resend OTP";
        }
    });

    confirmOtpBtn.addEventListener("click", async function() {
        const otp = otpInput.value.trim();
        if (!pendingPhone) { setVerificationStatus("Please request an OTP first."); return; }
        if (!/^\d{6}$/.test(otp)) { setVerificationStatus("Please enter the 6 digit OTP."); return; }
        confirmOtpBtn.disabled = true; confirmOtpBtn.textContent = "Verifying...";
        try {
            const { data, error } = await supabaseClient.auth.verifyOtp({ phone: pendingPhone, token: otp, type: "phone_change" });
            if (error) {
                console.error("Verify Mobile OTP Error:", error);
                setVerificationStatus(error.message || "Invalid or expired OTP.");
                return;
            }
            const verifiedUser = data?.user || currentUser;

            if (!verifiedUser) {
                setVerificationStatus("OTP verified, but user session could not be confirmed.");
                return;
            }

            // Get the latest authenticated user after phone_change verification.
            // Do not force a session refresh here because the verifyOtp response
            // already contains the latest authentication state.
            const {
                data: { user: latestUser },
                error: latestUserError
            } = await supabaseClient.auth.getUser();

            if (latestUserError) {
                console.warn("Latest Auth User Error:", latestUserError);
            }

            currentUser = latestUser || verifiedUser;
            mobileInput.value = pendingPhone.replace("+91", "");

            // Keep the verified state in this page session. The Save handler
            // will use this state instead of immediately replacing it with a
            // possibly stale cached session.
            mobileVerified =
                indianPhoneDigits(currentUser?.phone) ===
                indianPhoneDigits(pendingPhone);

            // Sync the verified number to customer_profiles.
            const { error: profileError } =
                await supabaseClient
                    .from("customer_profiles")
                    .update({
                        mobile: pendingPhone.replace("+91", "")
                    })
                    .eq("user_id", currentUser.id);

            if (profileError) {
                console.error("Profile Mobile Sync Error:", profileError);
                setVerificationStatus(
                    "Mobile verified, but profile update failed: " +
                    profileError.message
                );
                return;
            }

            // If Supabase returned the verified user with the new phone,
            // mark it verified immediately. Otherwise keep the OTP success
            // state for the current page and let the next load re-check Auth.
            if (mobileVerified || verifiedUser?.phone === pendingPhone) {
                mobileVerified = true;
                setVerificationStatus(
                    "✓ Mobile number verified successfully",
                    "success"
                );
            } else {
                // OTP itself was accepted, so allow the current form save.
                // A fresh page load will re-check the Auth user's phone.
                mobileVerified = true;
                setVerificationStatus(
                    "✓ Mobile number verified successfully",
                    "success"
                );
            }

            otpBox.style.display = "none";
            otpInput.value = "";

            if (mobileVerified) {
                setVerificationStatus(
                    "✓ Mobile number verified successfully",
                    "success"
                );
            } else {
                setVerificationStatus(
                    "OTP verified, but Auth phone status is still refreshing. Please wait a moment and try again.",
                    "pending"
                );
            }
        } catch (error) {
            console.error(error); setVerificationStatus("Unable to verify OTP. Please try again.");
        } finally {
            confirmOtpBtn.disabled = false; confirmOtpBtn.textContent = "Verify OTP";
        }
    });

    // ================================
    // LOAD PROFILE
    // ================================

    async function loadProfile() {

        loading.style.display = "block";

        try {

            const {
                data: { user },
                error: userError
            } = await supabaseClient.auth.getUser();


            if (userError || !user) {

                window.location.href = "login.html";

                return;
            }

            currentUser = user;
            await refreshAuthPhoneStatus(user);


            // Default values from Auth
            document.getElementById("full-name").value =
                user.user_metadata?.full_name || "";

            document.getElementById("mobile").value =
                user.user_metadata?.mobile || "";


            // Load saved profile
            const { data, error } =
                await supabaseClient
                    .from("customer_profiles")
                    .select("*")
                    .eq("user_id", user.id)
                    .maybeSingle();


            if (error) {

                console.error(
                    "Profile Load Error:",
                    error
                );

                showMessage(
                    "Unable to load profile. " +
                    error.message,
                    "error"
                );

                return;
            }


            // If profile already exists
            if (data) {

                document.getElementById("full-name").value =
                    data.full_name || "";

                document.getElementById("mobile").value =
                    data.mobile || "";

                document.getElementById("address").value =
                    data.address || "";

                document.getElementById("city").value =
                    data.city || "";

                document.getElementById("state").value =
                    data.state || "";

                document.getElementById("pincode").value =
                    data.pincode || "";

                saveBtn.textContent =
                    "Update Address";
            }

            // Check Auth phone only after the profile mobile field has been loaded.
            await refreshAuthPhoneStatus(currentUser);


        } catch (error) {

            console.error(error);

            showMessage(
                "Something went wrong while loading profile.",
                "error"
            );

        } finally {

            loading.style.display = "none";
        }
    }


    // ================================
    // SAVE / UPDATE PROFILE
    // ================================

    form.addEventListener("submit", async function(event) {

        event.preventDefault();


        // Get values
        const fullName =
            document.getElementById("full-name")
                .value.trim();

        const mobile =
            document.getElementById("mobile")
                .value.trim();

        const address =
            document.getElementById("address")
                .value.trim();

        const city =
            document.getElementById("city")
                .value.trim();

        const state =
            document.getElementById("state")
                .value.trim();

        const pincode =
            document.getElementById("pincode")
                .value.trim();


        // ================================
        // VALIDATION
        // ================================

        if (!fullName) {

            showMessage(
                "Please enter your full name.",
                "error"
            );

            return;
        }


        if (!/^[6-9][0-9]{9}$/.test(mobile)) {

            showMessage(
                "Please enter a valid 10 digit mobile number.",
                "error"
            );

            return;
        }

        const authPhone = normalizeIndianPhone(mobile);
        const authPhoneDigits = indianPhoneDigits(mobile);

        const {
            data: { user: saveUser },
            error: saveUserError
        } = await supabaseClient.auth.getUser();

        if (saveUserError || !saveUser) {
            showMessage("Unable to verify your login session. Please login again.", "error");
            return;
        }

        currentUser = saveUser;

        // Auth phone is the permanent verification proof.
        // pendingPhone is only needed during the OTP flow; after a page reload
        // it is null, so it must NOT be required for an already verified user.
        const savedAuthPhoneDigits = indianPhoneDigits(saveUser?.phone);
        const authPhoneMatches =
            !!savedAuthPhoneDigits &&
            !!authPhoneDigits &&
            savedAuthPhoneDigits === authPhoneDigits;

        const pageOtpMatches =
            mobileVerified &&
            !!pendingPhone &&
            indianPhoneDigits(pendingPhone) === authPhoneDigits;

        if (!authPhoneMatches && !pageOtpMatches) {
            showMessage("Please verify your mobile number with OTP before saving.", "error");
            setVerificationStatus("Please verify this mobile number with OTP.", "pending");
            mobileVerified = false;
            return;
        }

        mobileVerified = true;
        setVerificationStatus("✓ Mobile number verified", "success");


        if (!address) {

            showMessage(
                "Please enter your address.",
                "error"
            );

            return;
        }


        if (!city) {

            showMessage(
                "Please enter your city.",
                "error"
            );

            return;
        }


        if (!state) {

            showMessage(
                "Please enter your state.",
                "error"
            );

            return;
        }


        if (!/^[1-9][0-9]{5}$/.test(pincode)) {

            showMessage(
                "Please enter a valid 6 digit pincode.",
                "error"
            );

            return;
        }


        // ================================
        // GET USER
        // ================================

        const user = currentUser;

        if (!user) {
            window.location.href = "login.html";
            return;
        }


        // ================================
        // DISABLE BUTTON
        // ================================

        saveBtn.disabled = true;

        saveBtn.textContent = "Saving...";


        try {

            // ================================
            // UPSERT PROFILE
            // ================================

            const { error } =
                await supabaseClient
                    .from("customer_profiles")
                    .upsert(
                        {
                            user_id: user.id,
                            full_name: fullName,
                            mobile: mobile,
                            address: address,
                            city: city,
                            state: state,
                            pincode: pincode,
                            updated_at: new Date().toISOString()
                        },
                        {
                            onConflict: "user_id"
                        }
                    );


            if (error) {

                console.error(
                    "Save Profile Error:",
                    error
                );

                showMessage(
                    "Unable to save profile. " +
                    error.message,
                    "error"
                );

                return;
            }


            // ================================
            // UPDATE AUTH USER METADATA
            // ================================

            const { error: metadataError } =
                await supabaseClient.auth.updateUser({
                    data: {
                        full_name: fullName,
                        mobile: mobile
                    }
                });


            if (metadataError) {

                console.warn(
                    "Auth metadata update warning:",
                    metadataError
                );
            }


            showMessage(
                "Profile, address and verified mobile number saved successfully!",
                "success"
            );


            saveBtn.textContent =
                "Update Address";


        } catch (error) {

            console.error(error);

            showMessage(
                "Something went wrong while saving profile.",
                "error"
            );

        } finally {

            saveBtn.disabled = false;

            if (saveBtn.textContent !== "Update Address") {
                saveBtn.textContent = "Save Address";
            }
        }

    });


    // ================================
    // START
    // ================================

    loadProfile();

</script>

</body>
</html>
