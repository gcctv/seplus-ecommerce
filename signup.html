<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - SEPLUS</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f1f5f9; color: #102a43; }
        .topbar { min-height: 30px; padding: 8px 22px; background: #081b2b; color: #fff; font-size: 12px; letter-spacing: 1px; font-weight: 700; }
        .signup-container { width: calc(100% - 32px); max-width: 470px; margin: 32px auto; padding: 30px 32px; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 12px 34px rgba(15, 23, 42, .08); }
        .brand { text-align: center; margin-bottom: 26px; }
        .brand h1 { margin: 0; font-size: 32px; letter-spacing: 1px; color: #102a43; }
        .brand .tagline { margin-top: 4px; color: #64748b; font-size: 10px; font-weight: 700; letter-spacing: 2.5px; }
        .brand p { margin: 15px 0 0; color: #64748b; font-size: 15px; }
        label.field-label { display: block; margin: 0 0 7px; font-weight: 700; font-size: 14px; }
        .field { width: 100%; padding: 12px 13px; margin-bottom: 17px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; background: #fff; }
        .field:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, .1); }
        .terms-row { display: flex; align-items: flex-start; gap: 10px; margin: 1px 0 18px; color: #475569; font-size: 13px; line-height: 1.55; }
        .terms-row input { width: 16px; height: 16px; margin: 2px 0 0; flex: 0 0 auto; accent-color: #102a43; }
        a { color: #1d4ed8; text-decoration: none; font-weight: 700; }
        a:hover { text-decoration: underline; }
        button { width: 100%; padding: 13px; border: none; border-radius: 8px; background: #102a43; color: white; font-size: 16px; font-weight: 700; cursor: pointer; }
        button:hover { background: #183b5b; }
        button:disabled { opacity: .65; cursor: wait; }
        #message { text-align: center; margin-top: 15px; font-weight: 700; font-size: 14px; line-height: 1.5; }
        .login-link { margin-top: 22px; padding-top: 18px; border-top: 1px solid #e2e8f0; text-align: center; color: #64748b; font-size: 14px; }
        .login-link a { margin-left: 4px; }
        .footer-note { text-align: center; margin: 0 auto 25px; padding: 0 16px; color: #64748b; font-size: 12px; }
        @media (max-width: 480px) { .signup-container { margin: 18px auto; padding: 25px 20px; } .brand h1 { font-size: 29px; } }
    </style>
</head>
<body>
    <div class="topbar">SEPLUS &nbsp; SECURITY SOLUTIONS</div>
    <main class="signup-container">
        <div class="brand">
            <h1>SEPLUS</h1>
            <div class="tagline">SECURITY SOLUTIONS</div>
            <p>Create your customer account</p>
        </div>

        <form id="signupForm">
            <label class="field-label" for="name">Full Name</label>
            <input class="field" type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="name" required>

            <label class="field-label" for="mobile">Mobile Number</label>
            <input class="field" type="tel" id="mobile" name="mobile" placeholder="Enter your 10-digit mobile number" maxlength="10" inputmode="numeric" autocomplete="tel-national" pattern="[0-9]{10}" title="Enter a 10-digit mobile number" required>

            <label class="field-label" for="email">Email</label>
            <input class="field" type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>

            <label class="field-label" for="password">Password</label>
            <input class="field" type="password" id="password" name="password" placeholder="Create a password (minimum 6 characters)" minlength="6" autocomplete="new-password" required>

            <label class="field-label" for="confirmPassword">Confirm Password</label>
            <input class="field" type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" minlength="6" autocomplete="new-password" required>

            <label class="terms-row" for="agreeTerms">
                <input type="checkbox" id="agreeTerms" name="agreeTerms" required>
                <span>I agree to the <a href="terms.html" target="_blank" rel="noopener noreferrer">Terms &amp; Conditions</a> and acknowledge that I have read the <a href="privacy-policy.html" target="_blank" rel="noopener noreferrer">Privacy Policy</a>.</span>
            </label>

            <button type="submit" id="signupButton">Create Account</button>
        </form>

        <div id="message" role="status" aria-live="polite"></div>

        <div class="login-link">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </main>
    <div class="footer-note">© 2026 SEPLUS · CCTV &amp; Security Solutions</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://uxujlcahvnzohohnjclv.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_sna7FS8E7-w7pXG3_u-rRw__q2Dcv0_";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        document.getElementById("signupForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const mobile = document.getElementById("mobile").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const message = document.getElementById("message");
            const signupButton = document.getElementById("signupButton");

            if (!document.getElementById("agreeTerms").checked) {
                message.textContent = "Please agree to the Terms & Conditions to create an account.";
                return;
            }

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                return;
            }

            message.textContent = "Creating account...";
            signupButton.disabled = true;

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: name,
                            mobile: mobile
                        }
                    }
                });

                if (error) {
                    console.error("Signup error:", error);
                    message.textContent = error.message;
                    signupButton.disabled = false;
                    return;
                }

                message.textContent = "Account created successfully. Please check your email to confirm your account.";
            } catch (error) {
                console.error("Unexpected signup error:", error);
                message.textContent = "Unable to create the account right now. Please try again.";
                signupButton.disabled = false;
            }
        });
    </script>
</body>
</html>
